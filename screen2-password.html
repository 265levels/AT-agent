<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tribe – KYC Password</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="phone-frame">
    <!-- Status bar simulation -->
    <div class="status-bar dark">
      <span class="time">17:41</span>
      <div class="status-icons">
        <span class="icon">▶</span>
        <span class="icon">■</span>
        <span class="icon">●</span>
        <span class="battery">72</span>
      </div>
    </div>

    <main class="screen">
      <!-- Logo -->
      <div class="logo-area">
        <div class="logo-icon">
          <svg viewBox="0 0 80 60" width="72" height="54">
            <path d="M40 4 C22 4 10 22 10 36 C10 50 22 58 40 58 C58 58 70 50 70 36 C70 22 58 4 40 4 Z" fill="#E31C23"/>
            <path d="M40 14 C30 14 24 24 24 34 C24 44 30 50 40 50 C50 50 56 44 56 34 C56 24 50 14 40 14 Z" fill="#E31C23"/>
            <ellipse cx="40" cy="34" rx="10" ry="12" fill="#fff"/>
          </svg>
        </div>
        <h1 class="brand">tribe</h1>
      </div>

      <!-- Password field -->
      <div class="form-area">
          <div class="input-group password-group">
              <label class="floating-label" for="kyc-password">KYC Password</label>
          <div class="password-row">
              <input
                type="password"
                id="kyc-password"
                class="password-input"
                placeholder=""
                autocomplete="current-password"
              />
          <button type="button" class="toggle-visibility" id="toggle-password" aria-label="Show password">
            <!-- Eye open (show) -->
            <svg class="icon-eye" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#c0392b" stroke-width="1.8">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <!-- Eye with slash (hide) – starts hidden -->
            <svg class="icon-eye-off" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#c0392b" stroke-width="1.8" style="display:none">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
            
          </div>
            
          <div class="underline"></div>
        </div>

        <a href="#" class="forgot-link">Forgot Password?</a>
        
        <button class="btn-primary disabled" type="button" id="proceed-btn" disabled>
          Proceed Securely
        </button>
      </div>

      <!-- Footer -->
      <footer class="footer">
        <p class="legal">
          By proceeding, you agree to our<br />
          <a href="#">Terms &amp; Conditions</a> and <a href="#">Privacy Policy</a>
        </p>
        <p class="version">Version 2.54.1 | MW</p>
      </footer>
    </main>
  </div>

  <script>
    const passwordInput = document.getElementById('kyc-password');
    const toggleBtn = document.getElementById('toggle-password');
    const proceedBtn = document.getElementById('proceed-btn');
    const eyeOpen = toggleBtn.querySelector('.icon-eye');
    const eyeOff = toggleBtn.querySelector('.icon-eye-off');
  
    // Show / hide password
    toggleBtn.addEventListener('click', function () {
      const isHidden = passwordInput.type === 'password';
      passwordInput.type = isHidden ? 'text' : 'password';
      eyeOpen.style.display = isHidden ? 'none' : 'block';
      eyeOff.style.display = isHidden ? 'block' : 'none';
      toggleBtn.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
    });
  
    // Enable Proceed button only when password has text
    passwordInput.addEventListener('input', function () {
      if (passwordInput.value.trim().length > 0) {
        proceedBtn.disabled = false;
        proceedBtn.classList.remove('disabled');
      } else {
        proceedBtn.disabled = true;
        proceedBtn.classList.add('disabled');
      }
    });
  </script>
</body>
</html>
