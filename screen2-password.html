<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tribe – KYC Password</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="phone-frame">
    <!-- Status bar simulation -->
    <div class="status-bar dark">
      <span class="time">17:41</span>
      <div class="status-icons">
        <span class="icon">▶</span>
        <span class="icon">■</span>
        <span class="icon">●</span>
        <span class="battery">72</span>
      </div>
    </div>

    <main class="screen">
      <!-- Logo -->
      <div class="logo-area">
        <div class="logo-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 148">
              <path fill="#ED1C24" d="M144.5 27Q141 24 133.5 21.5Q126 19 121 19Q116 19 106 21.5Q96 24 90.5 26.5Q85 29 77.5 34Q70 39 61 48.5Q52 58 49.5 63.5Q47 69 47 73Q47 77 48 79Q49 81 52.5 83.5Q56 86 59.5 86Q63 86 69.5 83Q76 80 91 69.5Q106 59 111.5 56Q117 53 120.5 52Q124 51 128.5 51Q133 51 135.5 53Q138 55 139 57Q140 59 140.5 63Q141 67 140 71.5Q139 76 134.5 83Q130 90 119.5 100Q109 110 99 115.5Q89 121 88 121Q87 121 85.5 119.5Q84 118 84.5 116Q85 114 93 105Q101 96 102 93Q103 90 100.5 88Q98 86 94 86Q90 86 88 87Q86 88 82 92Q78 96 75.5 101Q73 106 73 111.5Q73 117 75 119.5Q77 122 79 123Q81 124 85 124Q89 124 98 120.5Q107 117 118.5 108.5Q130 100 139 89Q148 78 151 71.5Q154 65 154.5 55Q155 45 153.5 40.5Q152 36 150 33Q148 30 144.5 27Z"/>
            </svg>
        </div>
        <h1 class="brand">tribe</h1>
      </div>

      <!-- Password field -->
      <div class="form-area">
          <div class="input-group password-group">
              <label class="floating-label" for="kyc-password">KYC Password</label>
          <div class="password-row">
              <input
                type="password"
                id="kyc-password"
                class="password-input"
                placeholder=""
                autocomplete="current-password"
              />
          <button type="button" class="toggle-visibility" id="toggle-password" aria-label="Show password">
            <!-- Eye open (show) -->
            <svg class="icon-eye" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#c0392b" stroke-width="1.8">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <!-- Eye with slash (hide) – starts hidden -->
            <svg class="icon-eye-off" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#c0392b" stroke-width="1.8" style="display:none">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
            
          </div>
            
          <div class="underline"></div>
        </div>

        <a href="#" class="forgot-link">Forgot Password?</a>
        
        <button class="btn-primary disabled" type="button" id="proceed-btn" disabled>
          Proceed Securely
        </button>
      </div>

      <!-- Footer -->
      <footer class="footer">
        <p class="legal">
          By proceeding, you agree to our<br />
          <a href="#">Terms &amp; Conditions</a> and <a href="#">Privacy Policy</a>
        </p>
        <p class="version">Version 2.54.1 | MW</p>
      </footer>
    </main>
  </div>

  <script>
    const passwordInput = document.getElementById('kyc-password');
    const toggleBtn = document.getElementById('toggle-password');
    const proceedBtn = document.getElementById('proceed-btn');
    const eyeOpen = toggleBtn.querySelector('.icon-eye');
    const eyeOff = toggleBtn.querySelector('.icon-eye-off');
  
    // Show / hide password
    toggleBtn.addEventListener('click', function () {
      const isHidden = passwordInput.type === 'password';
      passwordInput.type = isHidden ? 'text' : 'password';
      eyeOpen.style.display = isHidden ? 'none' : 'block';
      eyeOff.style.display = isHidden ? 'block' : 'none';
      toggleBtn.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
    });
  
    // Enable Proceed button only when password has text
    passwordInput.addEventListener('input', function () {
      if (passwordInput.value.trim().length > 0) {
        proceedBtn.disabled = false;
        proceedBtn.classList.remove('disabled');
      } else {
        proceedBtn.disabled = true;
        proceedBtn.classList.add('disabled');
      }
    });
  </script>
</body>
</html>
